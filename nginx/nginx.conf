upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

upstream admin {
    server admin:80;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 30m;

    # Broadcast / welcome media: videos up to 50 MB
    location ~ ^/api/admin/broadcasts/(welcome/)?media {
        client_max_body_size 55m;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
        proxy_set_header X-Webhook-Secret $http_x_webhook_secret;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location ~ ^/yandex_[a-f0-9]+\.html$ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://admin/;
    }

    location /blog {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Приватные маршруты — закрыты от индексации через HTTP-заголовок
    location ~ ^/(thread|history|profile|login|source-view|agents)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://frontend;
    }

    # URL с query-параметрами треда — тоже закрыть
    location = /thread {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://frontend;
    }

    location / {
        proxy_pass http://frontend;
    }
}
