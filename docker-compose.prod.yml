# Production stack. Use: docker compose -f docker-compose.prod.yml up -d --build
# See docs/DEPLOY.md for VPS + ISPmanager setup.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aisearch}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ./backend
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aisearch}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      DEBUG: "false"
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      PERPLEXITY_MODEL_LITE: ${PERPLEXITY_MODEL_LITE:-sonar}
      PERPLEXITY_MODEL_PRO: ${PERPLEXITY_MODEL_PRO:-sonar-pro}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-https://glosix.ru}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_VAT_CODE: ${YOOKASSA_VAT_CODE:-1}
      YOOKASSA_TAX_SYSTEM_CODE: ${YOOKASSA_TAX_SYSTEM_CODE:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    volumes:
      - upload_data:/data/uploads
    networks:
      - internal

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aisearch}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      PERPLEXITY_MODEL_LITE: ${PERPLEXITY_MODEL_LITE:-sonar}
      PERPLEXITY_MODEL_PRO: ${PERPLEXITY_MODEL_PRO:-sonar-pro}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-https://glosix.ru}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
    depends_on:
      - backend
      - redis
    volumes:
      - upload_data:/data/uploads
    command: celery -A celery_app worker --beat --loglevel=info
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_MAX_BOT_URL: ${VITE_MAX_BOT_URL:-https://max.ru}
        VITE_PUBLIC_URL: ${VITE_PUBLIC_URL:-https://glosix.ru}
        VITE_BUILD_ID: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal

  admin:
    build:
      context: ./admin
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROXY_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
      - admin
    networks:
      - internal

volumes:
  pgdata:
  redisdata:
  upload_data:

networks:
  internal:
    driver: bridge
