<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />

    <!--
      Первый скрипт в <head> — до любых SEO-тегов.
      Для приватных маршрутов (/thread, /history, /profile, /login, /source-view)
      и MAX WebApp параметров — сразу добавляем noindex и убираем canonical.
      Это видит краулер при любом рендеринге, включая raw HTML без JS.
    -->
    <script>
      (function () {
        var path = location.pathname || "/";
        var search = location.search || "";
        var hash = location.hash || "";
        var q = search.charAt(0) === "?" ? search.slice(1) : search;

        var privatePaths = ["/thread", "/history", "/profile", "/login", "/source-view"];
        var isPrivatePath = privatePaths.some(function (p) {
          return path === p || path.indexOf(p + "/") === 0;
        });
        var privateQuery = /(?:^|&)(?:WebAppStartParam|etext|startapp)(?:=|&|$)/i.test(q);
        var privateHash = /(?:^|[&#])(?:WebAppData|WebAppPlatform|WebAppVersion)=/i.test(hash);

        if (!isPrivatePath && !privateQuery && !privateHash) return;

        // Добавляем noindex сразу — до всех остальных мета-тегов на странице
        var robots = "noindex, nofollow, noarchive";
        ["robots", "googlebot", "yandex"].forEach(function (name) {
          var el = document.createElement("meta");
          el.setAttribute("name", name);
          el.setAttribute("content", robots);
          document.head.appendChild(el);
        });
        document.title = "Glosix";

        // Убираем публичные SEO-теги, которые могут добавиться ниже в HTML
        document.addEventListener("DOMContentLoaded", function () {
          document.querySelector('link[rel="canonical"]')?.remove();
          document.querySelector('meta[name="description"]')?.remove();
          document.querySelectorAll('meta[property^="og:"], meta[name^="twitter:"]').forEach(function (el) {
            el.remove();
          });
        });
      })();
    </script>

    <!--
      SEO-теги публичных страниц. Для приватных маршрутов они будут удалены
      скриптом выше (DOMContentLoaded) или хуком usePageRobots в React.
    -->
    <meta
      name="description"
      content="Glosix - ИИ ассистент и умный поиск. Ищет в интернете онлайн по источникам и дает готовый ответ. Генерирует документы и картинки, обрабатывает PDF, Word, Excel и фото. Переводит тексты. ИИ чат с нейросетью. Доступен в браузере и мессенджере MAX."
    />
    <meta name="theme-color" content="#20808d" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="Glosix - умный поиск с источниками, ИИ чат" />
    <meta
      property="og:description"
      content="Glosix - ИИ ассистент и умный поиск. Ищет в интернете онлайн по источникам и дает готовый ответ. Генерирует документы и картинки, обрабатывает PDF, Word, Excel и фото. Переводит тексты. ИИ чат с нейросетью. Доступен в браузере и мессенджере MAX."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Glosix - умный поиск с источниками, ИИ чат" />
    <meta
      name="twitter:description"
      content="Glosix - ИИ ассистент и умный поиск. Ищет в интернете онлайн по источникам и дает готовый ответ. Генерирует документы и картинки, обрабатывает PDF, Word, Excel и фото. Переводит тексты. ИИ чат с нейросетью. Доступен в браузере и мессенджере MAX."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Canonical только для публичных страниц. React (usePageRobots) управляет
      canonical динамически. Здесь ставим корень как дефолт для главной.
    -->
    <link rel="canonical" href="https://glosix.ru/" />
    <title>Glosix - умный поиск с источниками, ИИ чат</title>

    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <script>
      (function () {
        try {
          var hash = location.hash || "";
          if (!/(?:^|[&#])WebAppData=/i.test(hash)) return;
          var body = hash.charAt(0) === "#" ? hash.slice(1) : hash;
          var params = new URLSearchParams(body);
          var data = params.get("WebAppData");
          if (data) {
            sessionStorage.setItem("glosix-max-init-data", data);
            try { localStorage.setItem("glosix-max-init-data", data); } catch (e2) {}
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#6b6b6b;background:#f3f3ef">
        Загрузка…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
