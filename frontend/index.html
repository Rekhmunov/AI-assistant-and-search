<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <script>
      (function () {
        var search = location.search || "";
        var q = search.charAt(0) === "?" ? search.slice(1) : search;
        if (!/(?:^|&)(?:WebAppStartParam|etext|startapp)(?:=|&|$)/i.test(q)) return;
        var robots = "noindex, nofollow, noarchive";
        ["robots", "googlebot", "yandex"].forEach(function (name) {
          var el = document.createElement("meta");
          el.setAttribute("name", name);
          el.setAttribute("content", robots);
          document.head.appendChild(el);
        });
        document.title = "Glosix";
      })();
    </script>
    <meta
      name="description"
      content="Glosix - ИИ ассистент и умный поиск. Ищет в интернете онлайн по источникам и дает готовый ответ. Генерирует документы и картинки, обрабатывает PDF, Word, Excel и фото. Переводит тексты. ИИ чат с нейросетью. Доступен в браузере и мессенджере MAX."
    />
    <meta name="theme-color" content="#20808d" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="Glosix - умный поиск с источниками, ИИ чат" />
    <meta
      property="og:description"
      content="Glosix - ИИ ассистент и умный поиск. Ищет в интернете онлайн по источникам и дает готовый ответ. Генерирует документы и картинки, обрабатывает PDF, Word, Excel и фото. Переводит тексты. ИИ чат с нейросетью. Доступен в браузере и мессенджере MAX."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Glosix - умный поиск с источниками, ИИ чат" />
    <meta
      name="twitter:description"
      content="Glosix - ИИ ассистент и умный поиск. Ищет в интернете онлайн по источникам и дает готовый ответ. Генерирует документы и картинки, обрабатывает PDF, Word, Excel и фото. Переводит тексты. ИИ чат с нейросетью. Доступен в браузере и мессенджере MAX."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://glosix.ru/" />
    <title>Glosix - умный поиск с источниками, ИИ чат</title>
    <script>
      (function () {
        var path = location.pathname || "/";
        var search = location.search || "";
        var hash = location.hash || "";
        var privatePaths = ["/thread", "/history", "/profile", "/login", "/source-view"];
        var isPrivatePath = privatePaths.some(function (p) {
          return path === p || path.indexOf(p + "/") === 0;
        });
        var privateQuery = /(?:^|&)(?:WebAppStartParam|etext|startapp)(?:=|&|$)/i.test(
          search.charAt(0) === "?" ? search.slice(1) : search
        );
        var privateHash = /(?:^|[&#])(?:WebAppData|WebAppPlatform|WebAppVersion)=/i.test(hash);
        if (!isPrivatePath && !privateQuery && !privateHash) return;
        var robots = "noindex, nofollow, noarchive";
        ["robots", "googlebot", "yandex"].forEach(function (name) {
          var el = document.createElement("meta");
          el.setAttribute("name", name);
          el.setAttribute("content", robots);
          document.head.appendChild(el);
        });
        document.querySelector('link[rel="canonical"]')?.remove();
        document.querySelector('meta[name="description"]')?.remove();
        document.querySelectorAll('meta[property^="og:"], meta[name^="twitter:"]').forEach(function (el) {
          el.remove();
        });
        document.title = "Glosix";
      })();
    </script>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <script>
      (function () {
        try {
          var hash = location.hash || "";
          if (!/(?:^|[&#])WebAppData=/i.test(hash)) return;
          var body = hash.charAt(0) === "#" ? hash.slice(1) : hash;
          var params = new URLSearchParams(body);
          var data = params.get("WebAppData");
          if (data) {
            sessionStorage.setItem("glosix-max-init-data", data);
            try { localStorage.setItem("glosix-max-init-data", data); } catch (e2) {}
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
